[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutpilot"
version = "0.1.0"
description = "Autonomous model-independent video-editing copilot with DaVinci Resolve integration and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CutPilot Team", email = "dev@cutpilot.local" }
]
keywords = ["video-editing", "davinci-resolve", "mcp", "whisper", "gemini", "ai-video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]
mcp = [
    "fastmcp>=0.4.0",
]

[project.scripts]
cutpilot = "cutpilot_mcp.server:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast isolated in-memory unit tests",
    "mock: Integration tests using mocked backends or in-process protocol dispatch",
    "live: Integration tests requiring a running DaVinci Resolve instance on localhost",
]
